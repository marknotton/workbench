nodeLinker: node-modules

enableGlobalCache: false

compressionLevel: mixed

# Consuming applications may be edited from more than one platform (a Linux
# container and a macOS host, for instance). Packages with native binaries ship
# one optional dependency per platform, so fetching all of them keeps either
# machine buildable without reinstalling and clobbering the other.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
